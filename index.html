<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario semanal</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h2>Horario Semanal</h2>

    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>8:00-9:00</th>

                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Inglés</td>
                <td>Física</td>
                <td>Química</td>
            </tr>
            <tr>
                <th>9:00 - 10:00</th>

                <td>Inglés</td>
                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Química</td>
                <td>Física</td>
            </tr>
            <tr>
                <th>10:00 - 11:00</th>

                <td>Física</td>
                <td>Química</td>
                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Inglés</td>
            </tr>
            <tr>
                <th>11:00 - 12:00</th>

                <td>Historia</td>
                <td>Inglés</td>
                <td>Física</td>
                <td>Matemáticas</td>
                <td>Química</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
